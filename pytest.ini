[pytest]
# Where the Gherkin feature files and their step files are (same layout as in class):
#   features/*.feature        the scenarios
#   features/steps/*_steps.py the Python functions behind each Gherkin step
testpaths = features/steps
python_files = *_steps.py
bdd_features_base_dir = features/

# Options used on every run:
#   --base-url      the website under test (page.goto("/login") opens <base-url>/login)
#   --alluredir     where Allure writes its raw results
#   --reruns 2      re-run a failed test up to 2 times (the demo site is sometimes slow or answers 503)
#   --screenshot    keep a screenshot only for failed tests (in test-results/)
addopts =
    --base-url=https://automationexercise.com
    --alluredir=allure-results --clean-alluredir
    --reruns=2 --reruns-delay=2
    --screenshot=only-on-failure

# Logs from our page objects are shown in the console and saved in the Allure report
log_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s

# Tags used in the .feature files. Run a group with:  pytest -m smoke
markers =
    smoke: the most important tests, quick to run
    regression: the full set of tests
    login: login and logout
    search: product search
    contact: contact-us form
    cart: shopping cart
    data_driven: test data read from Excel, SQLite, Redis or JSON

# pytest-playwright's own base_url fixture triggers a pytest deprecation warning; not our code.
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
