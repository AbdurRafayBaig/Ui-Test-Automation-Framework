# Runs every night (and by hand from the Actions tab): the smoke tests on
# every browser and on Linux, Windows and macOS, plus a mobile phone screen.
# This shows the framework works on many browsers and platforms.
name: Cross-browser

on:
  schedule:
    - cron: '0 2 * * *' # every night at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.browser }} on ${{ matrix.os }}${{ matrix.device && ' (mobile)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browser: chromium }
          - { os: ubuntu-latest, browser: firefox }
          - { os: ubuntu-latest, browser: webkit }
          - { os: windows-latest, browser: chromium }
          - { os: macos-latest, browser: webkit }
          - { os: ubuntu-latest, browser: chromium, device: 'Pixel 7' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python test_data/create_test_data.py
      - name: Run the smoke tests
        shell: bash
        run: |
          if [ -n "${{ matrix.device }}" ]; then
            pytest -m smoke --browser ${{ matrix.browser }} --device "${{ matrix.device }}"
          else
            pytest -m smoke --browser ${{ matrix.browser }}
          fi
      - name: Build the Allure report
        if: always()
        run: npx -y allure@3.33.0 generate allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-${{ matrix.os }}-${{ matrix.browser }}${{ matrix.device && '-mobile' || '' }}
          path: allure-report
          retention-days: 14
