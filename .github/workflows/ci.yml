# Main pipeline (runs on GitHub's servers):
#   - Pull request   -> check the code + run the @smoke tests (quick feedback before merging)
#   - Merge to main  -> run ALL tests, then publish the Allure report on GitHub Pages
#   - Push to develop -> run ALL tests
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: UI tests (${{ github.event.inputs.browser || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      # A real Redis server, so the Redis test data is read from real Redis here
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install the browser
        run: python -m playwright install --with-deps ${{ env.BROWSER }}

      - name: Check every feature file and test can be loaded
        run: pytest --collect-only -q

      - name: Build test data (Excel, SQLite) and fill Redis
        run: python test_data/create_test_data.py --redis

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pytest -m smoke --browser $BROWSER
          else
            pytest --browser $BROWSER
          fi

      - name: Build the Allure report
        if: always()
        run: npx -y allure@3.33.0 generate allure-results

      - name: Upload the Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ env.BROWSER }}
          path: allure-report
          retention-days: 14

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-${{ env.BROWSER }}
          path: test-results
          retention-days: 7

      - name: Prepare the report for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-report:
    name: Publish the Allure report on GitHub Pages
    needs: tests
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tests.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
