name: Framework enhancement
description: Propose a new capability for the framework (browser, data source, reporter, CI...)
labels: [enhancement, framework]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
